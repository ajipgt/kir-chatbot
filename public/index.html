<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asisten Regulasi KIR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <header class="chat-header">
      <div class="header-icon">
  <img
    src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Logo_of_the_Ministry_of_Transportation_of_the_Republic_of_Indonesia.svg"
    alt="Logo Kemenhub"
    width="40"
    height="40"
  />
</div>
      <div class="header-icon">
  <img
    src="https://upload.wikimedia.org/wikipedia/commons/0/01/Seal_of_Lumajang_Regency.svg"
    alt="Logo Kemenhub"
    width="40"
    height="40"
  />
</div>
      <div class="header-text">
        <h1>Asisten Regulasi KIR</h1>
        <p>UPUBKB Dinas Perhubungan Kabupaten Lumajang</p>
      </div>
    </header>

    <div id="chat-box" class="chat-box">
      <div class="message bot intro">
        <div class="bubble">
          Halo! Saya asisten regulasi KIR UPUBKB Kabupaten Lumajang. Silakan tanyakan
          seputar prosedur, persyaratan, atau regulasi pengujian kendaraan bermotor.
        </div>
      </div>
    </div>

    <form id="chat-form" class="chat-form">
      <input
        type="text"
        id="user-input"
        placeholder="Ketik pertanyaan KIR..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="send"
        required
      />
      <button type="submit" aria-label="Kirim">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>

  </div>
  <script src="script.js"></script>
</body>
</html>
